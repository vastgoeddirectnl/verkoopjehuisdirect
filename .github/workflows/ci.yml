name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-en-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Dependencies installeren
        run: npm ci

      - name: Tests draaien
        run: npm test

      # Sinds 5.5.0 (LINT-01) op flat config; blokkeert de build nu wel.
      - name: Linten
        run: npm run lint

      - name: Productiebuild controleren
        run: npm run build
        env:
          # De build hoeft niet naar de echte database; deze waarden zijn alleen
          # nodig omdat sommige modules ze bij het laden verwachten.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          ADMIN_SESSION_SECRET: ci-secret-alleen-voor-de-build
          ADMIN_PASSWORD: ci-wachtwoord
          ADMIN_TOTP_SECRET: ci-totp-secret-alleen-voor-de-build
          NEXT_PUBLIC_SITE_URL: https://www.vastgoeddirectnederland.nl
